name: API

# The platform tests need a real Postgres, so CI provides one as a service container. Mocking the
# database would leave the constraints, cascades and transaction boundaries untested — and those
# are half the design in this package.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/collab/**'
      - 'apps/export-worker/**'
      - 'packages/schema/**'
      - 'packages/collab/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Accounts, orgs, assets and collaboration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hela
          POSTGRES_PASSWORD: hela
          POSTGRES_DB: helaengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the API integration suite
        run: pnpm --filter @helaengine/api test
        env:
          TEST_DATABASE_URL: postgres://hela:hela@localhost:5432/helaengine_test

      # The room server's own suite needs no database — it substitutes an in-memory store, so the
      # tests are about the sync protocol rather than about Postgres. It runs here because it is the
      # other half of the same feature and belongs next to the tests it shares a schema with.
      - name: Run the collaboration server suite
        run: pnpm --filter @helaengine/collab-server test

      # Its own database and a Redis, because the export pipeline is BullMQ end to end and a mocked
      # queue would test the mock. Separate from the API's database on purpose: both suites drop and
      # re-migrate their schema, and sharing one makes them delete each other's tables in parallel.
      - name: Create the worker's database
        run: PGPASSWORD=hela psql -h localhost -U hela -d helaengine_test -c 'create database helaengine_worker_test'

      - name: Run the export worker suite
        run: pnpm --filter @helaengine/export-worker test
        env:
          TEST_DATABASE_URL: postgres://hela:hela@localhost:5432/helaengine_worker_test
          TEST_REDIS_URL: redis://localhost:6379

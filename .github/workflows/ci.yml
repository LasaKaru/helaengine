name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `pnpm test` runs *every* package's suite, and two of them talk to real infrastructure — the
    # API to Postgres, the export worker to Postgres and Redis. That is deliberate (a mocked
    # database leaves the constraints and transaction boundaries untested), and it means this job
    # needs the same service containers `api.yml` provides. Without them the whole `pnpm test` step
    # fails on connection errors, which reads as "the tests are broken" rather than "CI is missing a
    # database".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hela
          POSTGRES_PASSWORD: hela
          POSTGRES_DB: helaengine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Its own database, because both suites drop and re-migrate their schema and turbo runs
      # packages in parallel — sharing one has them delete each other's tables mid-test.
      - name: Create the worker's database
        run: PGPASSWORD=hela psql -h localhost -U hela -d helaengine_test -c 'create database helaengine_worker_test'

      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://hela:hela@localhost:5432/helaengine_test
          TEST_REDIS_URL: redis://localhost:6379

      # Exercises the real ingest path against the committed sources. Thumbnails are skipped
      # because they need a browser; the compression, measurement and manifest stages are what
      # regress, and they run here in full.
      - name: Asset pipeline smoke test
        run: pnpm ingest-assets
        env:
          SKIP_THUMBNAILS: '1'

  e2e:
    name: Editor end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The suite starts the platform API (Sprint 28-29) and the collaboration server (Sprint 31) as
    # Playwright web servers, and both need a real database. Without one they never answer their
    # health check and the whole run dies waiting — so CI provides Postgres rather than the suite
    # quietly skipping everything that needs an account.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hela
          POSTGRES_PASSWORD: hela
          POSTGRES_DB: helaengine_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The export worker is one of the web servers this suite starts (Sprint 32), and it does not
      # come up without a queue to consume — so the whole run would sit waiting on a health check
      # that can never pass. Sprint 32 added Postgres here and missed this; Sprint 33's end-to-end
      # trace test, which needs the worker's spans, is what made the omission obvious.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @helaengine/editor exec playwright install --with-deps chromium

      # The editor has nothing to render without the asset library, and the library is generated
      # output rather than something committed — so it is built here before the suite runs.
      - name: Build asset library
        run: pnpm ingest-assets
        env:
          SKIP_THUMBNAILS: '1'

      # The engine bundle the worker inlines into every export. Generated output, so it has to be
      # built here rather than committed.
      - name: Build the engine runtime
        run: pnpm --filter @helaengine/engine build

      - name: Run editor e2e suite
        run: pnpm --filter @helaengine/editor e2e
        env:
          TEST_DATABASE_URL: postgres://hela:hela@localhost:5432/helaengine_e2e
          TEST_REDIS_URL: redis://localhost:6379

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/editor/playwright-report/
          retention-days: 7
